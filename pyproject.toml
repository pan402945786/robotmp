[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotmp"
version = "0.1.0"
description = "A minimal predictive robotics failure-skill MVP"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "robotmp contributors"}]
dependencies = []

[project.optional-dependencies]
video = ["Pillow>=11", "imageio-ffmpeg>=0.6"]
simulation = ["pybullet>=3.2.7", "Pillow>=11", "imageio-ffmpeg>=0.6"]

[project.scripts]
robotmp = "robotmp.cli:main"
robotmp-sim = "robotmp.sim_cli:main"
robotmp-sim-video = "robotmp.sim_video:main"

[tool.setuptools.packages.find]
include = ["robotmp*"]
