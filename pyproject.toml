[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotmp"
version = "0.1.0"
description = "A minimal predictive robotics failure-skill MVP"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "robotmp contributors"}]
dependencies = []

[project.scripts]
robotmp = "robotmp.cli:main"

[tool.setuptools.packages.find]
include = ["robotmp*"]
